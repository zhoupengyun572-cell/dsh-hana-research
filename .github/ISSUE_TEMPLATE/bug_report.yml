name: Bug report
description: 报告可复现的功能、安装或界面问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先移除真实论文正文、API Key、本机绝对路径及其他敏感信息。
  - type: checkboxes
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issues，未找到相同问题。
          required: true
        - label: 我使用的是公开发布版本，而不是作者本地开发副本。
          required: true
        - label: 我已对日志、截图和示例数据进行脱敏。
          required: true
  - type: input
    attributes:
      label: Hana Research 版本
      placeholder: 例如 0.4.0-beta.1
    validations:
      required: true
  - type: input
    attributes:
      label: DeepSeek Harness / dsh 版本
      placeholder: 粘贴版本号
    validations:
      required: true
  - type: dropdown
    attributes:
      label: 操作系统
      options:
        - Windows
        - Linux
        - macOS
        - 其他
    validations:
      required: true
  - type: input
    attributes:
      label: Node.js 版本
      placeholder: node --version
    validations:
      required: true
  - type: textarea
    attributes:
      label: 问题描述
      description: 说明实际结果与预期结果。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    attributes:
      label: 脱敏日志或截图
      description: 可直接拖入截图；不要上传真实研究材料或密钥。
  - type: dropdown
    attributes:
      label: 是否涉及数据损坏或丢失风险
      options:
        - 否
        - 可能涉及
        - 是
    validations:
      required: true
